<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · Escapadas Finde</title>
  <style>
    :root { color-scheme: light dark; --fondo: #f4efe6; --texto: #17211f; --suave: #5b6663; --acento: #0f6b5c; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #0f1514; --texto: #eef3f1; --suave: #a6b3af; --acento: #4fc3a7; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: var(--fondo); color: var(--texto); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 440px; }
    h1 { font-size: 1.7rem; margin: 0 0 8px; }
    p { color: var(--suave); margin: 0 0 20px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; background: var(--acento); color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que la página ya no exista. Las ofertas siguen en la portada.</p>
    <!-- El despliegue pone aquí la dirección de la web (la 404 se sirve en cualquier ruta). -->
    <a href="./" data-inicio>Ir a Escapadas Finde</a>
  </main>
</body>
</html>
