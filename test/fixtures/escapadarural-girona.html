Type":260},"61436402a5bc4","Villa Cristina","villa-cristina",{"name":15,"slug":16},{"name":348,"slug":349},"Vilajuïga","vilajuiga","42.333022","3.092856","Villa Cristina es un amplio alojamiento situado en la urbanización El Veïnat de Dalt (Vilajuïga), lejos de zonas residenciales. La propiedad no tiene vecinos directos, es decir, pueden disfrutar de gran privacidad. \r\n\r\nSe trata de una villa con capacidad para 10 personas, bien equipada e ideal para familias o grupos de amigos que vengan a visitar la Costa Brava. Cuenta con piscina privada, amplio ",{"min":31,"max":27},{"numPhotos":355,"numVideos":31,"thumb":356},45,"https:\u002F\u002Fwebp.er2.co\u002Fes\u002Fgirona\u002F61436402a5bc4\u002F375\u002F646f6b9243503.webp",{"amount":358,"currency":35},2500,{"numReviews":186,"score":127},{"id":361,"cardType":226,"name":362,"slug":363,"province":364,"village":365,"distanceInKm":5,"latitude":368,"longitude":369,"description":370,"rentType":23,"numBeds":140,"numRooms":79,"capacity":371,"media":372,"price":5,"priceType":5,"averagePrice":374,"review":375,"hasOnlineBooking":40,"hasFreeCancellations":40,"isHighlight":39,"hasVerifiedCalendar":40,"hasDeals":39,"currentDeal":5,"confirmationType":260},"0000000006261","Can Cirera","can-cirera",{"name":15,"slug":16},{"name":366,"slug":367},"Serinyà","serinya","42.171451","2.747693","Can Cirera, casa rural que se encuentra en Serinyà, a 15 minutos de Girona, Banyoles a 5 minutos en coche, Olot y Besalú a 25 minutos... \r\nCon jardín, terraza, cocina equipada, sala grande, sala de juegos...  cuenta con aire acondicionado, WiFi gratuita(300MB) y aparcamiento privado gratis.\r\nLa casa tiene 4 dormitorios, 2 baños completos, ropa de cama, toallas, secadores de cabellos, TV de pantall",{"min":55,"max":25},{"numPhotos":218,"numVideos":31,"thumb":373},"https:\u002F\u002Fwebp.er2.co\u002Fes\u002Fgirona\u002F0000000006261\u002F375\u002F63c564b3266e9.webp",{"amount":125,"currency":35},{"numReviews":31,"score":31},{"id":377,"cardType":226,"name":378,"slug":379,"province":380,"village":381,"distanceInKm":5,"latitude":384,"longitude":385,"description":386,"rentType":23,"numBeds":140,"numRooms":79,"capacity":387,"media":388,"price":5,"priceType":5,"averagePrice":390,"review":392,"hasOnlineBooking":40,"hasFreeCancellations":40,"isHighlight":39,"hasVerifiedCalendar":40,"hasDeals":39,"currentDeal":5,"confirmationType":260},"5a91161657040","Mas Font  - Un rincón del paraiso","mas-font-un-rincon-del-paraiso",{"name":15,"slug":16},{"name":382,"slug":383},"Aiguaviva","aiguaviva_girona","41.943193","2.764167","Mas Font es una masía catalana del siglo XVIII, concretamente del año 1771, perfecta para desconectar y disfrutar con la familia o en pareja.  Mas font fue construida piedra a piedra por nuestra familiia y durante 21 años ha sido perfeccionada para hacer del entorno y la casa un lugar ideal. Poco a poco hemos conseguido que Mas font albergue todas las comodidades y accesorios necesarios, para que,",{"min":83,"max":223},{"numPhotos":162,"numVideos":31,"thumb":389},"https:\u002F\u002Fwebp.er2.co\u002Fes\u002Fgirona\u002F5a91161657040\u002F375\u002F5a911ddd95253.webp",{"amount":391,"currency":35},4400,{"numReviews":31,"score":31},463,[],[],{"region":397,"province":400,"village":5,"zone":5,"corner":5},{"name":398,"slug":399},"Cataluña","cataluna",{"name":15,"slug":16},{"id":402,"name":15,"slug":16,"image":403,"type":404,"isIndexable":40,"parentName":398,"parentSlug":399,"parentType":405,"longitude":406,"latitude":407,"parentLongitude":408,"parentLatitude":409},31689,"https:\u002F\u002Fucmedia.er2.co\u002Fes\u002Fdes-main\u002F158\u002F1600\u002F31689.jpg?1789552442","province","region",2.805738,41.979485,1.520862,41.591159,{"bounds":411,"totalItems":393,"pagination":416},{"neLat":412,"neLng":413,"swLat":414,"swLng":415},42.333022,3.145202,41.830604,2.074457,{"currentPage":83,"nextPage":55,"prevPage":83,"totalPages":160,"maxPerPage":142,"firstPageIndex":83,"lastPageIndex":27},{"error":5,"success":418},{"data":419},{"title":420,"description":421,"image":422,"name":15},"Qué hacer en una escapada rural por Girona","\u003Cp>Girona es una ciudad de origen romano de m&aacute;s de 2000 a&ntilde;os y eso se nota mucho cuando la est&aacute;s recorriendo. \u003Cstrong>Girona\u003C\u002Fstrong> ha vivido invasiones de todo tipo, asedios, guerras y hambrunas. Todo esto deja marca en la ciudad y se siente. Pero Girona, adem&aacute;s, tambi&eacute;n es una espectacular provincia llena de rincones para explorar entre el \u003Cstrong>mar\u003C\u002Fstrong>, la \u003Cstrong>monta&ntilde;a\u003C\u002Fstrong> y pueblos llenos de encanto.\u003C\u002Fp>\r\n\r\n\u003Cp>En verano, no puedes dejar de gozar de las playas de agua cristalina y las calas secretas que te ofrece la \u003Cstrong>\u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fcosta-brava\">Costa Brava\u003C\u002Fa>\u003C\u002Fstrong>. Los mejores meses para descubrirla son mayo, junio y septiembre. Gozar&aacute;s de buena temperatura sin el agobio de las muchedumbres de los meses fuertes del verano.\u003C\u002Fp>\r\n\r\n\u003Ch3>La Garrotxa, magia entre hayas y volcanes\u003C\u002Fh3>\r\n\r\n\u003Cp>Situado en la comarca de la Garrotxa, a apenas 30 kil&oacute;metros de Girona ciudad, se encuentra \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fbesalu\">\u003Cstrong>Besal&uacute;\u003C\u002Fstrong>\u003C\u002Fa>. Est&aacute; catalogada como conjunto hist&oacute;rico-art&iacute;stico nacional y sus calles est&aacute;n llenas de testimonios de una &eacute;poca en que la comunidad jud&iacute;a y la cristiana conviv&iacute;an en armon&iacute;a. Uno de sus encantos es su espectacular e imponente \u003Cstrong>puente medieval\u003C\u002Fstrong>. Pero no te hacemos m&aacute;s spoilers y dejamos que lo descubras con tus propios ojos.\u003C\u002Fp>\r\n\r\n\u003Cp>En la comarca de la \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fla-garrotxa\">\u003Cstrong>Garrotxa\u003C\u002Fstrong>\u003C\u002Fa> tambi&eacute;n encontrar&aacute;s una fant&aacute;stica colecci&oacute;n de tesoros naturales, entre los que vale la pena destacar el \u003Cstrong>Parque Natural de la Zona Volc&aacute;nica\u003C\u002Fstrong>. Las tonalidades de su paisaje cambian de una temporada a otra pero siempre mantienen el encanto de los bosques salvajes de los cuentos de hadas. Aparte de la espectacular \u003Cstrong>Fageda d&rsquo;en Jord&agrave;\u003C\u002Fstrong>, merece una visita la preciosa capital de comarca: Olot.\u003C\u002Fp>\r\n\r\n\u003Cp>\u003Cstrong>\u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Folot\">Olot\u003C\u002Fa>\u003C\u002Fstrong> es una ciudad din&aacute;mica, vital y muy rica en cuanto a patrimonio cultural. Muy cerca de la ciudad tambi&eacute;n encontrar&aacute;s otras localidades llenas encanto como Castellfollit de la Roca o Santa Pau. Una escapada rural en olot se podr&iacute;a resumir perfectamente en dos palabras: naturaleza y gastronom&iacute;a.\u003C\u002Fp>\r\n\r\n\u003Cp>As&iacute; pues, Olot es un enclave ideal para los amantes del senderismo y, sobre todo, la buena comida. Si eres carn&iacute;voro no puedes perderte el jabal&iacute;, el cerdo con casta&ntilde;as o el nabo con trufa y patatas.\u003C\u002Fp>\r\n\r\n\u003Ch3>El Ripoll&egrave;s, un trozo de pirineo con mucho car&aacute;cter\u003C\u002Fh3>\r\n\r\n\u003Cp>Pero la provincia de Girona no ser&iacute;a lo mismo sin la comarca del Ripoll&egrave;s, donde gastronom&iacute;a, naturaleza y cultura se funden para formar un territorio rural lleno de posibilidades. En su capital, \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fripoll\">\u003Cstrong>Ripoll\u003C\u002Fstrong>\u003C\u002Fa>, podr&aacute;s gozar de la atm&oacute;sfera medieval. Adem&aacute;s, no puedes perderte su selecta gastronom&iacute;a.\u003C\u002Fp>\r\n\r\n\u003Cp>Te recomendamos especialmente que pruebes sus deliciosas setas, los embutidos de cerdo de la zona y los \u003Cstrong>quesos\u003C\u002Fstrong>. Puede que regreses con un par de kilos m&aacute;s, &iexcl;pero la sonrisa que te sacar&aacute;n sus sabores no te la va a quitar nadie!\u003C\u002Fp>\r\n\r\n\u003Cp>Adem&aacute;s, en esta comarca podr&aacute;s gozar de la \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fnuria\">\u003Cstrong>Vall de N&uacute;ria\u003C\u002Fstrong>\u003C\u002Fa>, una estaci&oacute;n de esqu&iacute; muy singular que destaca por su belleza y el atractivo especial de su tren cremallera, el cual abrocha a los visitantes a trav&eacute;s de las monta&ntilde;as del Pirineo hasta el valle. Este funicular-cremallera salva una altura de m&aacute;s de 1.000 metros, con lo cual, el paisaje y las fotos que sacar&aacute;s ser&aacute;n incre&iacute;bles.\u003C\u002Fp>\r\n\r\n\u003Cp>Y si la Vall de N&uacute;ria te parece interesante, &iexcl;el Valle de Camprod&oacute;n te encantar&aacute;! El elemento m&aacute;s famoso del pueblo de \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fcamprodon\">\u003Cstrong>Camprod&oacute;n\u003C\u002Fstrong>\u003C\u002Fa> es el Pont Nou, que se alza sobre el r&iacute;o Ter. Esta estampa, rodeada de casitas de piedra y bosques, es la m&aacute;s t&iacute;pica de la ciudad. La localidad tambi&eacute;n es t&iacute;pica por sus callejuelas de piedra con casas con tejados de pizarra, las flores en los balconcitos y por sus rutas de senderismo.\u003C\u002Fp>\r\n\r\n\u003Cp>Adem&aacute;s, Camprod&oacute;n tambi&eacute;n es archiconocida por la f&aacute;brica de galletas Birba. Las encontrar&eacute;is en todas las tiendas y os recomendamos llevaros una cajita de metal, seguro que os alegrar&aacute; las tardes aburridas en la oficina y despu&eacute;s te queda un hermoso envase met&aacute;lico con la postal del Pont Nou de souvenir.\u003C\u002Fp>\r\n\r\n\u003Ch3>Monta&ntilde;as, estanques de leyenda y historias muy locas\u003C\u002Fh3>\r\n\r\n\u003Cp>En Catalunya hay un lugar lleno de magia que, nadas m&aacute;s llegar, recuerda a los impresionantes valles de Suiza, rodeados de vacas haciendo sonar sus campanas, monta&ntilde;as verdes y prados infinitos. En efecto, hablamos de \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fla-cerdanya\">\u003Cstrong>La Cerdanya\u003C\u002Fstrong>\u003C\u002Fa>. Con un pie en Espa&ntilde;a y otro en Francia, La Cerda&ntilde;a es un territorio muy singular, con una personalidad fuerte, salpicado de peque&ntilde;os pueblos con encanto e infinidad de actividades.\u003C\u002Fp>\r\n\r\n\u003Cp>En invierno, nada como gozar de excursiones con \u003Cstrong>raquetas por la nieve\u003C\u002Fstrong>, de expediciones con trineos o jornadas de esqu&iacute; sabiendo que, cuando se vaya el sol, te espera una acogedora habitaci&oacute;n bien calentita en alguno de los m&uacute;ltiples alojamientos rurales de La Cerdanya.\u003C\u002Fp>\r\n\r\n\u003Cp>La capital de La Cerdanya, \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fpuigcerda\">\u003Cstrong>Puigcerd&agrave;\u003C\u002Fstrong>\u003C\u002Fa>, es una localidad estrat&eacute;gicamente ubicada entre paisajes de ensue&ntilde;o. Recomendamos especialmente dar un paseo por el lago, en verano lleno de patos y cisnes muy activos y en invierno completamente helado. Aunque si eres de los m&aacute;s frioleros, siempre puedes refugiarte en alguna de las numerosas tiendas de su extensa zona comercial o aprovechar para tomarte alguna bebida caliente en su mercado popular, abierto los domingos por la ma&ntilde;ana.\u003C\u002Fp>\r\n\r\n\u003Cp>Otro de los pueblos imprescindibles de la provincia de Girona es \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Fbanyoles\">\u003Cstrong>Banyoles\u003C\u002Fstrong>\u003C\u002Fa>. Esta ciudad es la capital del \u003Cstrong>Pla de l&rsquo;Estany\u003C\u002Fstrong> y su principal atractivo es un enorme lago. Su lago es el m&aacute;s grande de Catalunya y fue subsede oficial de los Juegos Ol&iacute;mpicos de 1992, en la modalidad de remo y sede oficial del Campeonato Mundial de Remo en 2004.\u003C\u002Fp>\r\n\r\n\u003Cp>Su vieja leyenda cuenta que en el lago se escond&iacute;a un drag&oacute;n que, cuando se cansaba de comer jabal&iacute;es, se acercaba al pueblo y mataba a personas. La versi&oacute;n m&aacute;s extendida de la historia cuenta que ahora duerme al fondo del lago, tras ser amansado por un monje. Sin embargo, algunos curiosos afirman que, algunas noches de luna llena puede verse como se asoma entre las aguas calmadas. &iquest;Te atreves a comprobarlo?\u003C\u002Fp>\r\n\r\n\u003Cp>Sea como sea, lo que s&iacute; te recomendamos es que hagas la vuelta entera al lago; se trata de un paseo llano muy relajante en un entorno rural incomparable, entre &aacute;rboles, ca&ntilde;as y patos salvajes.\u003C\u002Fp>\r\n\r\n\u003Cp>El &uacute;ltimo salto de la Costa Brava antes de entrar a Francia es el \u003Ca href=\"https:\u002F\u002Fwww.escapadarural.com\u002Fcasas-rurales\u002Falt-emporda\">\u003Cstrong>Alt Empord&agrave;\u003C\u002Fstrong>\u003C\u002Fa>. Esta zona ofrece incre&iacute;bles propuestas para todos los gustos: desde tirarte en paraca&iacute;das hasta pasear por un m&iacute;stico claustro de un monasterio del medievo. En verano, no puedes perderte sus playas espl&eacute;ndidas, sus alucinantes restaurantes de Estrella Michel&iacute;n o el on&iacute;rico universo creativo del artista Salvador Dal&iacute;. Y, por si eso fuera poco, tambi&eacute;n tiene castillos, pueblitos con encanto e infinidad de peque&ntilde;as bodegas donde brindar por las improvisadas escapadas rurales a este lado del Mediterr&aacute;neo.\u003C\u002Fp>\r\n","https:\u002F\u002Fucmedia.er2.co\u002Fes\u002Fseo-images\u002F158\u002F31689.jpg",{"error":5,"success":424},{"data":425},{"reviews":426,"summary":534},[427,446,462,480,498,516],{"id":428,"title":429,"description":430,"points":38,"cottage":431,"traveler":440,"createdAt":445},"6aa94768deffc","Una estancia muy placentera.","Estuvimos en la casa 4 dias y estuvimos tan bien que nos hubiese gustado alargar la estancia. Sin duda volveremos a tener en cuenta esta casa para proximas escapadas.\r\nLa casa está muy bien preparada y si necesitas ir a comprar tienes varias opciones bastante cerca.\r\nTuvimos la oportunidad de bañarnos en la piscina un dia que hizo muy buen tiempo y lo disfrutamos. Los espacios están bien mantenidos y muy limpios.\r\nEn la casa se alojan mas personas así que pasada cierta hora no se puede hacer ruido, hay que tenerlo en cuenta por si la idea es estar de fiesta cosa que no seria posible.\r\nLos alrededores son increibles y se respira tranquilidad.\r\nEn resumen, recomendada.",{"id":432,"name":433,"slug":434,"region":435,"province":436,"village":437},"0000000013731","Can Cruanyes","can-cruanyes",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":438,"name":439},"sales-de-llierca","Sales de Llierca",{"id":441,"name":442,"media":443},"6a56183155e0a","Jordi Moreno Oliva",{"url":444},"https:\u002F\u002Fmedia.er2.co\u002Fprofile-images\u002Fimages\u002Fdefault\u002F77.png","2026-09-15 15:26:00",{"id":447,"title":448,"description":449,"points":38,"cottage":450,"traveler":457,"createdAt":461},"6a91cd52bb67c","Una estancia maravillosa.","Hemos pasado unos días de diez. En un entorno increíble. Y una casa llena de detalles, con todos los servicios necesarios y muy acogedora como sus anfitriones. \r\nGracies, Francesc i Dolors per la vostra sensibilitat y les vostres paraules.",{"id":451,"name":452,"slug":453,"region":454,"province":455,"village":456},"0000000004979","Mas La Riera","mas-la-riera",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":302,"name":301},{"id":458,"name":459,"media":460},"6a91cd523cbbb","Amanda Pedrajas",{"url":444},"2026-08-28 20:02:58",{"id":463,"title":464,"description":465,"points":38,"cottage":466,"traveler":475,"createdAt":479},"6a8d6acf07a35","Un lugar para soñar","El lugar es precioso: la casa, el entorno y sobretodo los anfitriones. A la casa no le falta de nada, es increíble. El entorno te da tranquilidad y paz. Los anfitriones de 10, se nota la preocupación por los huésped y esos pequeños detalles que ayudan a disfrutar de unos días de descanso.",{"id":467,"name":468,"slug":469,"region":470,"province":471,"village":472},"5f6a3cab3f7c0","Can Volant","cal-volant",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":473,"name":474},"sant-privat-d-en-bas","Sant Privat d'en Bas",{"id":476,"name":477,"media":478},"5b43bb64d5c10","Victor Duque Martin-urda",{"url":444},"2026-08-25 12:13:35",{"id":481,"title":482,"description":483,"points":38,"cottage":484,"traveler":493,"createdAt":497},"6a8b0e3637446","Acollidor i tranquil","Hem estat tota la família una setmana i ens hem trobat molt a gust! L'apartament està molt ben equipat i molt cuidat. \r\nEl poble és molt tranquil i a prop de tot, el que permet fer sortides molt xules.\r\nL'Ana és encantadora, molt atenta i fa recomanacions molt bones!\r\nFins aviat!",{"id":485,"name":486,"slug":487,"region":488,"province":489,"village":490},"5b02e2595fbb3","Loft Peralada ","loft-peralada",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":491,"name":492},"peralada","Peralada",{"id":494,"name":495,"media":496},"6a0f69b3da777","Maria Palacín Casasús",{"url":444},"2026-08-23 17:13:58",{"id":499,"title":500,"description":501,"points":38,"cottage":502,"traveler":511,"createdAt":515},"6a81dab17cdf5","Un oasi de pau al bell mig de la Costa BRava","Un lloc ideal on descansar, relaxar-se i gaudir de les vacances en familia.\r\nLa propietat et dona privacitat i tranquilitat, i l'equilibri entra zona exterior (porxo, jardí i piscina) i interior, és perfecta.\r\nL'equipament, en tots els sentits, és molt complert, no trobes res en falta.\r\nL'aire condicionat, imprescindible a l'estiu, funciona molt bé i permet el descans nocturn.\r\nL'atenció d'En David és excel.lent i molt propera, amb detalls de benvinguda que s'agraeixen.\r\nSens dubte un lloc per recomanar ... i tornar.",{"id":503,"name":504,"slug":505,"region":506,"province":507,"village":508},"67d71eea70eee","Can Cinto","can-cinto",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":509,"name":510},"vilamacolum","Vilamacolum",{"id":512,"name":513,"media":514},"69ad4e40aa851","Antoni Gallardo",{"url":444},"2026-08-16 17:43:45",{"id":517,"title":518,"description":519,"points":38,"cottage":520,"traveler":529,"createdAt":533},"6a7eddc189a49","Mas Tulsa: un refugio con encanto entre bosques","Cualquiera diría que existe un lugar tan encantador, apartado y rodeado de naturaleza donde realmente puedas desconectar y relajarte. Y sí, existe: Mas Tulsa.\r\n\r\nEsta preciosa masía reformada combina a la perfección la comodidad moderna con el encanto de las construcciones medievales. La piedra y la madera aportan una calidez especial y hacen que todo el conjunto se integre de forma armoniosa con el entorno natural. Algunos alojamientos conservan incluso ese aire de antiguas estancias o pequeñas mazmorras de un castillo, pero transformadas en espacios acogedores y confortables.\r\n\r\nRodeado de bosque, el lugar está cuidado hasta el último detalle y se nota el mimo y dedicación que hay detrás de su mantenimiento. Además, puedes disfrutar de sus caballos —tienen alrededor de una decena y se dejan tocar—, solicitar un masaje personalizado o participar en los talleres y actividades que organizan durante el año (merece la pena consultar su web).\r\n\r\nTambién cuenta con piscina, perfecta para refrescarse, aunque ojo con los aspersores del fondo, que se activan inesperadamente y pueden hacerte daño en el pie.\r\n\r\nEl alojamiento y el parking son limitados, pero esto contribuye precisamente a que la atención sea mucho más cercana y personalizada.\r\n\r\nUn auténtico capricho para quienes buscan naturaleza, tranquilidad y un lugar diferente. Si necesitas desconectar de verdad, Mas Tulsa es un rincón que merece la pena descubrir.",{"id":521,"name":522,"slug":523,"region":524,"province":525,"village":526},"5a8605dab72e4","Mas Tulsà Hotel Rural Barbacoa Girona","mas-tulsa",{"slug":399,"name":398},{"slug":16,"name":15},{"slug":527,"name":528},"palol-de-revardit","Palol de Revardit",{"id":530,"name":531,"media":532},"6a7edcdcb61c2","Astrid Florit",{"url":444},"2026-08-14 11:20:01",{"averageReviewScore":535,"bestScore":38,"countScore":536},4.803071364046974,2214,{"error":5,"success":538},{"data":539},{"modules":540},[541,664,673,706,739],{"title":542,"url":5,"seoEntities":543},"Los pueblos más populares de Girona",[544,547,550,553,556,559,562,565,568,571,574,577,580,583,586,589,592,595,598,601,604,607,610,613,616,619,622,625,628,631,634,637,640,643,646,649,652,655,658,661],{"name":545,"url":546},"Casas rurales Olot","\u002Fcasas-rurales\u002Folot",{"name":548,"url":549},"Casas rurales Santa Pau","\u002Fcasas-rurales\u002Fsanta-pau",{"name":551,"url":552},"Casas rurales Les Llosses","\u002Fcasas-rurales\u002Fles-llosses",{"name":554,"url":555},"Casas rurales La Vall de Bianya","\u002Fcasas-rurales\u002Fla-vall-de-bianya",{"name":557,"url":558},"Casas rurales Camprodon","\u002Fcasas-rurales\u002Fcamprodon",{"name":560,"url":561},"Casas rurales Calonge","\u002Fcasas-rurales\u002Fcalonge",{"name":563,"url":564},"Casas rurales Arbúcies","\u002Fcasas-rurales\u002Farbucies",{"name":566,"url":567},"Casas rurales Ribes de Freser","\u002Fcasas-rurales\u002Fribes-de-freser",{"name":569,"url":570},"Casas rurales Riudarenes","\u002Fcasas-rurales\u002Friudarenes",{"name":572,"url":573},"Casas rurales Viladrau","\u002Fcasas-rurales\u002Fviladrau",{"name":575,"url":576},"Casas rurales Sant Joan de les Abadesses","\u002Fcasas-rurales\u002Fsant-joan-de-les-abadesses",{"name":578,"url":579},"Casas rurales Sant Joan les Fonts","\u002Fcasas-rurales\u002Fsant-joan-les-fonts",{"name":581,"url":582},"Casas rurales Molló","\u002Fcasas-rurales\u002Fmollo",{"name":584,"url":585},"Casas rurales La Val
