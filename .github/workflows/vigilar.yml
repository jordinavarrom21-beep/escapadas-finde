# Vigila las ofertas, guarda el estado en la rama «datos»,
# publica el panel en GitHub Pages y envía los emails que tocan.
name: Vigilar ofertas

on:
  schedule:
    # GitHub no garantiza los crons: de las 48 ejecuciones diarias lanza unas 6 (una cada
    # ~4 h). La revisión cada 15 min la lanza «Revisión continua» (relevo.yml); este cron
    # queda de respaldo.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: Consultar todas las fuentes aunque no les toque
        type: boolean
        default: false
      email_prueba:
        description: Enviar un email de prueba a EMAIL_TO
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'config/**'
      - 'package*.json'
      - '.github/workflows/vigilar.yml'

permissions:
  contents: write   # guardar la rama «datos»
  pages: write      # publicar el panel
  id-token: write   # requerido por deploy-pages
  actions: write    # mantener activo el cron

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    # Los secretos NO van aquí (a nivel de job los verían npm ci, los tests y las acciones
    # de terceros): solo en los dos pasos que envían o leen correo.
    steps:
      # Acciones fijadas por SHA (el comentario dice qué versión es): una etiqueta se puede mover.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false   # que el token no quede guardado en .git para los pasos siguientes

      - name: Recuperar los datos guardados
        run: |
          # ls-remote devuelve 2 si la rama no existe y otro código si falla la red: en ese
          # caso hay que parar, porque seguir escanearía desde cero y el push forzado del
          # final sustituiría «datos» por un estado vacío (historial, avisos y vigilados).
          set +e
          git ls-remote --exit-code --heads origin datos > /dev/null
          codigo=$?
          set -e
          if [ "$codigo" -eq 0 ]; then
            git fetch --depth=1 origin datos
            git checkout FETCH_HEAD -- data
          elif [ "$codigo" -eq 2 ]; then
            echo "Primera ejecución: todavía no existe la rama «datos»"
          else
            echo "::error::No se ha podido consultar la rama «datos» (código $codigo): no se escanea para no perder los datos"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # Ninguna dependencia necesita scripts de instalación: así no se ejecuta código al instalar.
      # Sin las de desarrollo (ESLint, Playwright): las usa «Comprobar» en cada PR, no el escaneo.
      - run: npm ci --ignore-scripts --omit=dev
      - run: npm test

      - name: Escanear ofertas
        id: escaneo
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          BUZON_NOMBRES: ${{ secrets.BUZON_NOMBRES }}
          # Opcional y de pago: resúmenes de una frase con Claude (src/enriquecer/resumenes.js).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Tu dominio (variable del repositorio, no secreto): enlaces de los emails, sitemap y robots.txt.
          PANEL_URL: ${{ vars.PANEL_URL }}
        run: npm run escanear -- ${{ inputs.forzar && '--forzar' || '' }}

      - name: Email de prueba
        if: inputs.email_prueba
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: npm run email:prueba

      - name: Guardar los datos en la rama «datos»
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d data ] || { echo 'No hay datos que guardar'; exit 0; }
          rm -rf data/emails-prueba
          directorio="$(mktemp -d)"
          cp -r data "$directorio/"
          cd "$directorio"
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -q -m "Datos del $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos

      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' }}

      # La web lista para publicar (scripts/preparar-web.js, lo mismo que el zip de Hostinger):
      # sin copias de datos, caché versionada con el commit (cada despliegue instala la
      # interfaz nueva entera) y la dirección absoluta para compartir y para la 404. Con
      # la variable PANEL_URL (tu dominio), esa es la dirección; si no, la de GitHub Pages.
      - name: Preparar la web
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' }}
        env:
          BASE: ${{ vars.PANEL_URL || steps.pages.outputs.base_url }}
        run: node scripts/preparar-web.js --dir site --base "$BASE" --version "${GITHUB_SHA::12}" --htaccess

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' }}
        with:
          path: site

      - id: despliegue
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # La web lista para tu hosting (Hostinger…) en la rama «web-hosting», sin historial: tu
      # hosting la despliega sola con cada push (despliegue desde Git). Lee los datos de esta
      # web de Pages, así que siempre enseña las ofertas del momento. Con la variable
      # HOSTING_URL (tu dominio), además su dirección canónica, sitemap y un solo dominio.
      - name: Web para tu hosting (rama web-hosting)
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HOSTING_URL: ${{ vars.HOSTING_URL }}
        run: |
          node scripts/empaquetar.js --sin-zip --dominio "$HOSTING_URL"
          cd dist/escapadas-finde-web
          git init -q -b web-hosting
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web para tu hosting ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" web-hosting

      # Opcional: copia la web a tu hosting (p. ej. Hostinger) por FTP con TLS en cada escaneo,
      # para que tu dominio tenga siempre los datos al día. Se activa con la variable
      # FTP_ACTIVO = true y los secretos FTP_SERVIDOR, FTP_USUARIO y FTP_CONTRASENA (ver LEEME).
      # Borra en el hosting lo que ya no está en la web, salvo .well-known (certificado SSL).
      - name: Subir a tu hosting (FTP)
        if: ${{ !cancelled() && steps.escaneo.conclusion != 'skipped' && hashFiles('site/data/ofertas.json') != '' && vars.FTP_ACTIVO == 'true' }}
        env:
          FTP_SERVIDOR: ${{ secrets.FTP_SERVIDOR }}
          FTP_USUARIO: ${{ secrets.FTP_USUARIO }}
          LFTP_PASSWORD: ${{ secrets.FTP_CONTRASENA }}
          FTP_CARPETA: ${{ vars.FTP_CARPETA || 'public_html' }}
          # El certificado del FTP de muchos hostings es del servidor, no de tu dominio: por
          # eso por defecto no se comprueba (la conexión va cifrada igual). Pon «yes» si el tuyo casa.
          FTP_VERIFICAR_TLS: ${{ vars.FTP_VERIFICAR_TLS || 'no' }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp --env-password -u "$FTP_USUARIO" "$FTP_SERVIDOR" -e "set ftp:ssl-force true; set ssl:verify-certificate $FTP_VERIFICAR_TLS; set net:max-retries 2; set net:timeout 30; mirror --reverse --delete --parallel=6 --exclude-glob .well-known/ --exclude-glob cgi-bin/ site/ $FTP_CARPETA/; bye"

      # GitHub desactiva los crons de los repos sin actividad en 60 días.
      - name: Mantener vivo el cron
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/vigilar.yml/enable"
