# TEMPORAL: sondeo de webs de camping para decidir nuevas fuentes. Se borra al terminar.
name: Sondeo campings (temporal)
on:
  push:
    branches: [claude/cool-mendel-5qf0bs]
    paths: ['.github/workflows/sondeo-campings.yml', 'scripts/sondeo-campings.mjs']
permissions:
  contents: read
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/sondeo-campings.mjs
