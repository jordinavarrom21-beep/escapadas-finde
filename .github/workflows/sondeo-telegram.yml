# TEMPORAL: sondeo de canales públicos de Telegram. Se borra al terminar.
name: Sondeo Telegram (temporal)
on:
  push:
    branches: [claude/hostinger-plugin-install-un5ztn]
    paths: ['.github/workflows/sondeo-telegram.yml', 'scripts/sondeo-telegram.mjs']
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/sondeo-telegram.mjs
      - name: Guardar en la rama sondeo-eventos
        run: |
          git config user.name "sondeo" && git config user.email "sondeo@users.noreply.github.com"
          git checkout --orphan sondeo-eventos
          git rm -rq --cached .
          git add -f sondeo
          git commit -qm "Sondeo de Telegram"
          git push -f origin sondeo-eventos
