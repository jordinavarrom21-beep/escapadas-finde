# TEMPORAL: sondeo de APIs de aerolíneas gratis. Se borra al terminar.
name: Sondeo ofertas (temporal)
on:
  push:
    branches: [claude/cool-mendel-5qf0bs]
    paths: ['.github/workflows/sondeo-ofertas.yml', 'scripts/sondeo-ofertas.mjs']
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - run: node scripts/sondeo-ofertas.mjs
      - name: Guardar en la rama sondeo-aerolineas
        run: |
          git config user.name "sondeo" && git config user.email "sondeo@users.noreply.github.com"
          git checkout --orphan sondeo-aerolineas
          git rm -rq --cached .
          git add -f sondeo
          git commit -qm "Sondeo de aerolíneas"
          git push -f origin sondeo-aerolineas
