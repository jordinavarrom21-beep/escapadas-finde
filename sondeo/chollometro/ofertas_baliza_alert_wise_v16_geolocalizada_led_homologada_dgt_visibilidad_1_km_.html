false,"commentSummaryAvailable":false,"isAllowedToPostUpdate":false,"isExcludedFromAds":false,"threadDetails":{"preparedHtmlDescription":"\u003Cstrong\u003ELa baliza Alert Wise V16\u003C\/strong\u003E es un \u003Cstrong\u003Edispositivo luminoso homologado por la DGT\u003C\/strong\u003E que \u003Cstrong\u003Esustituye a los tri\u00e1ngulos\u003C\/strong\u003E y \u003Cstrong\u003Econecta con DGT 3.0 v\u00eda NB-IoT y SIM de 12 a\u00f1os\u003C\/strong\u003E. Usa \u003Cstrong\u003ELED amarillo visible hasta 1 km\u003C\/strong\u003E, \u003Cstrong\u003Epila de 9 V con 2 horas de autonom\u00eda\u003C\/strong\u003E, \u003Cstrong\u003Eprotecci\u00f3n IP54\u003C\/strong\u003E y \u003Cstrong\u003Ebase magn\u00e9tica\u003C\/strong\u003E.\u003Cbr \/\u003E\u003Cbr \/\u003E\u003Cstrong\u003EPUNTOS CLAVE\u003C\/strong\u003E\u003Cbr \/\u003E\u003Cimg src=\"https:\/\/static.chollometro.com\/threads\/raw\/IGP99\/2018102_1\/fs\/895x577\/qt\/65\/2018102_1.jpg\" data-image=\"2018102-IGP99\" data-height=\"8\" data-width=\"901\"\/\u003E\u003Cbr \/\u003E\u003Cul\u003E\u003Cli\u003E\ud83d\udea8 \u003Cstrong\u003EBaliza V16 homologada DGT\u003C\/strong\u003E, sustituye a los tri\u00e1ngulos\u003C\/li\u003E\u003Cli\u003E\ud83d\udce1 \u003Cstrong\u003EConecta con DGT 3.0\u003C\/strong\u003E v\u00eda NB-IoT, SIM 12 a\u00f1os gratis\u003C\/li\u003E\u003Cli\u003E\ud83d\udca1 \u003Cstrong\u003ELED amarillo auto\u003C\/strong\u003E, visible hasta 1 km y 360\u00b0\u003C\/li\u003E\u003Cli\u003E\ud83d\udd0b \u003Cstrong\u003EPila 9 V\u003C\/strong\u003E, hasta 2 h activa y 160 g\u003C\/li\u003E\u003Cli\u003E\ud83e\uddf2 \u003Cstrong\u003EIP54 y base magn\u00e9tica\u003C\/strong\u003E de neodimio, -10 a +50 \u00b0C\u003C\/li\u003E\u003C\/ul\u003E\u003Cbr \/\u003E\u003Cstrong\u003EM\u00c1S EN DETALLE\u003C\/strong\u003E\u003Cbr \/\u003E\u003Cimg src=\"https:\/\/static.chollometro.com\/threads\/raw\/stbfj\/2018102_1\/fs\/895x577\/qt\/65\/2018102_1.jpg\" data-image=\"2018102-stbfj\" data-height=\"6\" data-width=\"901\"\/\u003E\u003Cbr \/\u003E\u003Cstrong\u003ELa baliza Alert Wise V16 es un dispositivo de se\u00f1alizaci\u00f3n luminosa para veh\u00edculos\u003C\/strong\u003E que se utiliza cuando el veh\u00edculo queda detenido en la calzada por una aver\u00eda, un accidente o cualquier otra causa. \u003Cstrong\u003ESustituye a los tri\u00e1ngulos de prese\u00f1alizaci\u00f3n\u003C\/strong\u003E y \u003Cstrong\u003Eest\u00e1 homologada por la DGT\u003C\/strong\u003E. \u003Cstrong\u003EIncorpora conexi\u00f3n a la plataforma DGT 3.0\u003C\/strong\u003E y \u003Cstrong\u003Etransmite la ubicaci\u00f3n del veh\u00edculo de forma an\u00f3nima\u003C\/strong\u003E.\u003Cbr \/\u003E\u003Cbr \/\u003ELa comunicaci\u00f3n con DGT 3.0 se establece mediante \u003Cstrong\u003Etecnolog\u00eda NB-IoT\u003C\/strong\u003E a trav\u00e9s de una \u003Cstrong\u003ESIM integrada\u003C\/strong\u003E. Esta SIM incluye \u003Cstrong\u003E12 a\u00f1os de servicio gratuito\u003C\/strong\u003E. La conexi\u00f3n con la plataforma funciona de manera \u003Cstrong\u003Eindependiente a la aplicaci\u00f3n m\u00f3vil\u003C\/strong\u003E. El modelo incorpora la denominaci\u00f3n \u003Cstrong\u003EApp SOSAlert\u003C\/strong\u003E, lo que indica su compatibilidad con dicha aplicaci\u00f3n, aunque el env\u00edo de datos a la DGT no requiere su uso.\u003Cbr \/\u003E\u003Cbr \/\u003ELa se\u00f1al luminosa consiste en un \u003Cstrong\u003ELED de alta intensidad con reflector parab\u00f3lico\u003C\/strong\u003E. Emite luz de color \u003Cstrong\u003Eamarillo auto\u003C\/strong\u003E. La \u003Cstrong\u003Evisibilidad alcanza hasta 1 km\u003C\/strong\u003E. La cobertura es de \u003Cstrong\u003E360\u00b0 en horizontal\u003C\/strong\u003E y \u003Cstrong\u003E\u00b18\u00b0 en vertical\u003C\/strong\u003E. La \u003Cstrong\u003Efrecuencia de destello\u003C\/strong\u003E est\u00e1 entre \u003Cstrong\u003E0,8 y 1 Hz\u003C\/strong\u003E. La \u003Cstrong\u003Eintensidad luminosa es de 140 candelas a 0\u00b0\u003C\/strong\u003E.\u003Cbr \/\u003E\u003Cbr \/\u003EEl dispositivo se alimenta con una \u003Cstrong\u003Epila de 9 V\u003C\/strong\u003E. La \u003Cstrong\u003Eautonom\u00eda cuando est\u00e1 activado es de hasta 2 horas\u003C\/strong\u003E. En reposo, la pila puede durar \u003Cstrong\u003Ehasta 3 a\u00f1os\u003C\/strong\u003E. El peso es de aproximadamente \u003Cstrong\u003E160 g incluyendo la pila\u003C\/strong\u003E.\u003Cbr \/\u003E\u003Cbr \/\u003ELa baliza presenta \u003Cstrong\u003Eprotecci\u00f3n IP54\u003C\/strong\u003E, lo que la hace \u003Cstrong\u003Eresistente al polvo y a salpicaduras de agua\u003C\/strong\u003E. Soporta \u003Cstrong\u003Etemperaturas de funcionamiento entre -10 \u00b0C y +50 \u00b0C\u003C\/strong\u003E. Resiste \u003Cstrong\u003Evientos de hasta 18 m\/s\u003C\/strong\u003E, equivalentes a una presi\u00f3n de 180 Pa. La fijaci\u00f3n se realiza mediante una \u003Cstrong\u003Ebase magn\u00e9tica con imanes de neodimio\u003C\/strong\u003E, que permite una \u003Cstrong\u003Ecolocaci\u00f3n r\u00e1pida\u003C\/strong\u003E sobre la carrocer\u00eda. Los materiales son \u003Cstrong\u003EABS, policarbonato y TPR\u003C\/strong\u003E. El cuerpo es de \u003Cstrong\u003Ecolor negro\u003C\/strong\u003E. El modelo es \u003Cstrong\u003EMI VP10144-A\u003C\/strong\u003E y el fabricante es \u003Cstrong\u003EMIROVI, S.L.\u003C\/strong\u003E La homologaci\u00f3n tiene el n\u00famero \u003Cstrong\u003ELCOE 2023080717G1\u003C\/strong\u003E.\u003Cbr \/\u003E\u003Cbr \/\u003E\u003Cbr \/\u003E\u003Chr \/\u003E\u003Cem\u003EDescripci\u00f3n por el \u003Ca href=\"https:\/\/www.chollometro.com\/faqs#editar\" class=\"link\"\u003EEquipo Editorial de Chollometro\u003C\/a\u003E\u003C\/em\u003E"},"groups":[{"threadGroupId":"22","threadGroupName":"Coches y motos","threadGroupUrlName":"coche-y-moto","groupThreadTypeId":null,"assignedBySystem":null,"isDefault":true,"isDiscussion":false},{"threadGroupId":"632","threadGroupName":"Accesorios de coche","threadGroupUrlName":"equipo-de-co
