        function checkCJUniversalTag() {
            if (CookieConsent.consented) {
                if (CookieConsent.consent.statistics) { //Cambiar según el grupo al que pertenezca la cookie
                    let cookieName = "cje";
                    let domain = window.location.hostname == 'localhost' ? window.location.hostname : '.trasmed.com';
                    const queryString = window.location.search;
                    const urlParams = new URLSearchParams(queryString);
                    let cjevent = urlParams.get('cjevent');
                    if (cjevent != null) {
                        $.ajax({
                            type: 'POST',
                            url: '/User/IsCJCookieEnabled',
                            success: function (isEnabled) {
                                if (isEnabled === 'True') {
                                    var d = new Date();
                                    d = new Date(d.setMonth(d.getMonth() + 1));
                                    var expires = "expires=" + d.toGMTString();
                                    var cookie_string = cookieName + "=" + cjevent + "; " + expires;
                                    cookie_string += "; domain=" + domain + "; path=" + "/ " + ";secure;samesite=none;";
                                    document.cookie = cookie_string;
                                    saveCJValue(cjevent);
                                };
                            }
                        });
                    }
                }
            }
        }

        function saveCJValue(cjValue) {
            var shoppingProcessId = "";
            var step = "0";
            if (cjValue != null && step > 1) {
                var saveCJValueRequest = {
                    shoppingProcessId: shoppingProcessId,
                    cJValue: cjValue
                }
                $.ajax({
                    type: 'POST',
                    url: '/User/SaveCJValue',
                    data: saveCJValueRequest
                });
            }
        }

    </script>
